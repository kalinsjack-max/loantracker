<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060913">
<meta name="description" content="Haulat Tracker – track money you lent and borrowed, with requests, partial payments, reminders and statements.">
<meta property="og:title" content="হাওলাত ট্র্যাকার – Haulat Tracker"><meta property="og:description" content="Track lent & borrowed money with confirmation, reminders and statements."><meta property="og:type" content="website"><meta property="og:image" content="/icons/icon-512.png"><meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="manifest" href="/manifest.json">
<title>হাওলাত ট্র্যাকার</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>(function(){var t=localStorage.getItem('haulat_theme');if(t==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light')}})()</script>
<style id="dev-css">.devlink{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;text-decoration:none;color:var(--tx,#f1f5f9);letter-spacing:.01em}
.devlink .dl-n{display:inline-flex;align-items:center}
.devlink .dl-n b{font-weight:800;letter-spacing:.06em;background:linear-gradient(90deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;transition:background .3s,color .3s}
.devlink .dl-fb{width:0;height:1.15em;opacity:0;transform:translateX(-8px) scale(.6);flex:none;transition:width .3s ease,opacity .3s ease,transform .3s ease,margin .3s ease}
.devlink:hover .dl-fb,.devlink:focus-visible .dl-fb{width:1.15em;opacity:1;transform:none;margin-right:.4rem}
.devlink:hover .dl-n b,.devlink:focus-visible .dl-n b{background:none;-webkit-text-fill-color:var(--tx,#f1f5f9);color:var(--tx,#f1f5f9)}
@media(prefers-reduced-motion:reduce){.devlink .dl-fb,.devlink .dl-n b{transition:none}}</style>
</head>
<body class="antialiased">
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="toasts"></div>
<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4"><div id="modal-box" class="glass"></div></div>

<!-- LOGIN / SIGNUP -->
<main id="auth" class="hidden relative z-10 flex-1 items-center justify-center p-4 py-10">
  <div class="glass rounded-[2rem] p-7 w-full max-w-sm screen-in">
    <div class="flex justify-end gap-2 mb-2">
      <div class="seg"><button data-act="lang" data-lang="bn" data-v="bn" class="tab">বাংলা</button><button data-act="lang" data-lang="en" data-v="en" class="tab">EN</button></div>
      <button data-act="theme" class="ghost sm" aria-label="theme"><i data-ic="sun"></i></button>
    </div>
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-emerald-400 via-teal-500 to-sky-600 p-[1.5px] shadow-lg shadow-emerald-500/30">
      <div class="w-full h-full rounded-[14px] bg-[#060913] flex items-center justify-center"><span class="text-3xl font-extrabold bg-gradient-to-br from-emerald-300 to-sky-300 bg-clip-text text-transparent">৳</span></div>
    </div>
    <h1 class="text-2xl font-extrabold text-center mt-4" data-i="appName"></h1>
    <p class="text-xs text-center text-mut mt-1" data-i="tagline"></p>
    <p id="auth-sub" class="text-sm font-semibold text-center mt-5 mb-3" data-i="loginSub"></p>
    <form id="auth-form" class="space-y-3">
      <div id="signup-only" class="hidden space-y-3">
        <input id="a-name" class="inp" data-ph="namePh">
        <input id="a-user" class="inp" data-ph="userPh" autocapitalize="none" autocomplete="off">
      </div>
      <input id="a-email" type="email" required class="inp" data-ph="emailPh" autocomplete="email">
      <input id="a-pass" type="password" minlength="6" required class="inp" data-ph="passPh" autocomplete="current-password">
      <p id="auth-err" class="text-xs text-rose-400 min-h-[1rem]"></p>
      <button id="auth-btn" class="btn w-full py-3 text-sm" data-i="login"></button>
    </form>
    <div class="flex items-center gap-3 my-4 text-[11px] text-mut"><span class="flex-1 h-px bg-slate-500/25"></span><span data-i="or"></span><span class="flex-1 h-px bg-slate-500/25"></span></div>
    <button id="google-btn" class="ghost w-full py-2.5">
      <svg class="w-4 h-4" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6a14.5 14.5 0 0 1 0-9.2l-7.9-6.2a24 24 0 0 0 0 21.6l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      <span data-i="google"></span></button>
    <div class="flex justify-between mt-5 text-xs">
      <button id="toggle-mode" class="text-emerald-500 font-bold hover:underline" data-i="toSignup"></button>
      <button id="forgot" class="text-mut hover:underline" data-i="forgot"></button>
    </div>
  </div>
</main>

<!-- USERNAME SETUP -->
<main id="setup" class="hidden relative z-10 flex-1 items-center justify-center p-4 py-10">
  <form id="setup-form" class="glass rounded-[2rem] p-7 w-full max-w-sm space-y-3 screen-in">
    <h2 class="text-xl font-extrabold" data-i="setupTitle"></h2>
    <p class="text-xs text-mut" data-i="setupDesc"></p>
    <input id="s-name" class="inp" data-ph="namePh" required>
    <input id="s-user" class="inp" data-ph="userPh" required autocapitalize="none" autocomplete="off">
    <p id="setup-err" class="text-xs text-rose-400 min-h-[1rem]"></p>
    <button class="btn w-full py-3" data-i="save"></button>
    <button type="button" data-act="logout" class="text-xs text-mut w-full hover:underline" data-i="logout"></button>
  </form>
</main>

<!-- APP -->
<div id="app" class="hidden relative z-10 w-full max-w-6xl mx-auto px-4 sm:px-6 pt-4 pb-10 flex-1">
  <header class="glass rounded-3xl p-3.5 sm:p-4 mb-6 flex items-center justify-between gap-3 flex-wrap sticky top-3 z-30 fu">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-400 via-teal-500 to-sky-600 p-[1.5px] shrink-0">
        <div class="w-full h-full rounded-[14px] bg-[#060913] flex items-center justify-center"><span class="text-xl font-extrabold bg-gradient-to-br from-emerald-300 to-sky-300 bg-clip-text text-transparent">৳</span></div>
      </div>
      <div class="min-w-0"><h1 class="text-lg sm:text-xl font-extrabold leading-tight truncate" data-i="appName"></h1><p id="hello" class="text-[11px] text-mut truncate"></p></div>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <div class="seg"><button data-act="lang" data-lang="bn" data-v="bn" class="tab">বাংলা</button><button data-act="lang" data-lang="en" data-v="en" class="tab">EN</button></div>
      <select id="cur" class="ghost !py-2 mono outline-none cursor-pointer" aria-label="currency"><option value="৳">৳ BDT</option><option value="$">$ USD</option><option value="€">€ EUR</option><option value="£">£ GBP</option><option value="₹">₹ INR</option></select>
      <button data-act="theme" class="ghost" aria-label="theme"><i data-ic="sun"></i></button>
      <button data-act="tools" class="ghost" aria-label="tools"><i data-ic="tools"></i></button>
      <button data-act="notifs" class="ghost relative" aria-label="notifications"><span id="bell-ic"><i data-ic="bell"></i></span><span id="bell" class="hidden absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] rounded-full min-w-[1.1rem] h-[1.1rem] flex items-center justify-center font-bold shadow-lg shadow-rose-500/40">0</span></button>
      <button data-act="profile" id="me-btn" class="ghost !p-1 !pr-3 gap-2"></button>
    </div>
  </header>

  <section id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="glass rounded-3xl p-5 lift relative overflow-hidden">
      <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-emerald-500/20 blur-2xl"></div>
      <div class="flex justify-between gap-3 relative"><div>
        <div class="text-xs font-bold text-emerald-500 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span><span data-i="stLent"></span></div>
        <div id="st-lent" class="text-3xl font-extrabold mono mt-2">৳0</div><div id="st-lent-n" class="text-xs text-mut mt-1.5"></div></div>
        <div class="relative w-14 h-14 shrink-0"><svg class="donut w-14 h-14" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="rgba(148,163,184,.25)" stroke-width="5"/><circle id="ring-l" cx="28" cy="28" r="22" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.23" stroke-dashoffset="138.23"/></svg><span id="ring-l-t" class="absolute inset-0 flex items-center justify-center text-[10px] font-extrabold mono text-emerald-500">0%</span></div></div>
    </div>
    <div class="glass rounded-3xl p-5 lift relative overflow-hidden">
      <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-rose-500/20 blur-2xl"></div>
      <div class="flex justify-between gap-3 relative"><div>
        <div class="text-xs font-bold text-rose-500 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-rose-400"></span><span data-i="stOwed"></span></div>
        <div id="st-owed" class="text-3xl font-extrabold mono mt-2">৳0</div><div id="st-owed-n" class="text-xs text-mut mt-1.5"></div></div>
        <div class="relative w-14 h-14 shrink-0"><svg class="donut w-14 h-14" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="rgba(148,163,184,.25)" stroke-width="5"/><circle id="ring-o" cx="28" cy="28" r="22" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.23" stroke-dashoffset="138.23"/></svg><span id="ring-o-t" class="absolute inset-0 flex items-center justify-center text-[10px] font-extrabold mono text-rose-500">0%</span></div></div>
    </div>
    <div class="glass rounded-3xl p-5 lift relative overflow-hidden">
      <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-indigo-500/20 blur-2xl"></div>
      <div class="relative"><div class="text-xs font-bold text-indigo-500 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-indigo-400"></span><span data-i="stNet"></span></div>
        <div id="st-net" class="text-3xl font-extrabold mono mt-2">৳0</div><div id="st-net-s" class="text-xs text-mut mt-1.5"></div><div id="st-pend" class="text-xs text-amber-500 font-semibold mt-1"></div>
        <div class="h-1.5 rounded-full bg-slate-500/20 overflow-hidden flex mt-3"><div id="bar-l" class="h-full bg-emerald-400 transition-all duration-700" style="width:50%"></div><div id="bar-o" class="h-full bg-rose-400 transition-all duration-700" style="width:50%"></div></div></div>
    </div>
  </section>

  <section id="insights" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"></section>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <form id="add-form" class="lg:col-span-4 glass rounded-3xl p-5 space-y-4 lg:sticky lg:top-28 fu">
      <h2 class="font-extrabold flex items-center gap-2.5"><span class="mico"><i data-ic="plus"></i></span><span data-i="formTitle"></span></h2>
      <div class="seg w-full !grid grid-cols-2">
        <button type="button" id="t-lent" data-act="ftype" data-v="lent" class="tab on" data-i="typeLent"></button>
        <button type="button" id="t-borrowed" data-act="ftype" data-v="borrowed" class="tab" data-i="typeBorrowed"></button>
      </div>
      <div class="relative">
        <label class="lb" data-i="withWho"></label>
        <input id="f-person" class="inp" required autocomplete="off" data-ph="withPh">
        <div id="suggest" class="hidden absolute z-20 left-0 right-0 mt-1.5 glass rounded-2xl overflow-hidden"></div>
        <p id="sel-note" class="text-[11px] mt-1.5 text-mut" data-i="hintPersonal"></p>
      </div>
      <div><label class="lb"><span data-i="amount"></span></label><input id="f-amount" type="number" step="any" min="0.01" required class="inp mono font-bold text-base" placeholder="0.00">
        <div class="flex gap-1.5 mt-2"><button type="button" data-act="qa" data-v="500" class="ghost sm mono">+500</button><button type="button" data-act="qa" data-v="1000" class="ghost sm mono">+1,000</button><button type="button" data-act="qa" data-v="5000" class="ghost sm mono">+5,000</button></div></div>
      <div><label class="lb"><span data-i="note"></span> <span data-i="optional"></span></label><input id="f-note" class="inp" data-ph="notePh"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lb" data-i="date"></label><input id="f-date" type="date" required class="inp !text-xs"></div>
        <div><label class="lb"><span data-i="due"></span></label><input id="f-due" type="date" class="inp !text-xs"></div>
      </div>
      <button id="f-submit" class="btn w-full py-3 text-sm"><i data-ic="check"></i><span data-i="add"></span></button>
    </form>

    <section class="lg:col-span-8 space-y-3">
      <div class="glass rounded-3xl p-3.5 space-y-3 fu">
        <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between">
          <div class="seg" id="views"></div>
          <div class="relative sm:w-60"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-mut"><i data-ic="search"></i></span><input id="q" class="inp !pl-9 !py-2 !text-xs" data-ph="searchPh"></div>
        </div>
        <div class="seg" id="tabs"></div>
      </div>
      <div id="actions" class="hidden"></div>
      <div id="list" class="space-y-3"></div>
    </section>
  </div>
</div>

<!-- FOOTER -->
<footer class="relative z-10 w-full border-t backdrop-blur-xl mt-auto" style="background:var(--sub);border-color:var(--bd);color:var(--mut)">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 pb-5">
    <div class="fl flex justify-center flex-wrap gap-x-5 gap-y-1 text-[13px] mb-5"><a href="/help.html" class="text-emerald-400 hover:underline">Help</a><a href="/privacy.html" class="text-emerald-400 hover:underline">Privacy</a><a href="/terms.html" class="text-emerald-400 hover:underline">Terms</a></div>
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2 pt-4 border-t text-[13px]" style="border-color:var(--bd)">
      <span id="foot-copy">© ২০২৬ হাওলাত ট্র্যাকার। সর্বস্বত্ব সংরক্ষিত।</span>
      <!-- 👉 put YOUR Facebook link in the href below -->
      <a class="devlink" href="https://www.facebook.com/saim.aishorjo" target="_blank" rel="noopener noreferrer" aria-label="Developer on Facebook"><span class="dl-t">Developed By :</span><span class="dl-n"><svg class="dl-fb" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg><b>AISHORJO</b></span></a>
    </div>
  </div>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
